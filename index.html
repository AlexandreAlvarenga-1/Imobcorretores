    const ps = ids.map(getProp); const letters = ['A', 'B', 'C'];
    const rows = [
      ['Preço', p => p.price, v => fmtBRL(v), 'min'], ['Área', p => p.area, v => fmtNum(v) + ' m²', 'max'], ['Preço por m²', p => isRent(p) ? p.price / p.area : pricePerM2(p), v => fmtBRL(v), 'min'],
      ['Quartos', p => p.beds, v => v, 'max'], ['Suítes', p => p.suites, v => v, 'max'], ['Vagas', p => p.parking, v => v, 'max'], ['Condomínio', p => p.condo, v => v ? fmtBRL(v) : '—', 'min'],
      ['Valorização estimada', p => p.apprec, v => fmtPct(v) + '/ano', 'max'], ['vs. referência do bairro', p => vsRef(p) ?? 0, v => fmtPct(v), 'min'], ['Características', p => p.features.length + (p.furnished ? 1 : 0), v => v, 'max']
    ];
    const mixed = new Set(ps.map(p => p.purpose)).size > 1;
    return `<section class="panel" style="margin-bottom:16px"><div class="panel-head"><div><h2>Imóveis comparados</h2><div class="sub">Escolha 2 ou 3 imóveis. Diferenças percentuais são relativas ao imóvel A.</div></div></div>
      <div class="grid g3">${[0, 1, 2].map(i => `<label class="field"><span>Imóvel ${letters[i]}</span><select class="input" data-cmpi="${i}">${i === 2 ? '<option value="">Nenhum</option>' : ''}${propOptions(ids[i] || '')}</select></label>`).join('')}</div>
      ${mixed ? `<div class="note warn" style="margin-top:12px">${ic('alert')}<div>Você está comparando imóveis de venda e de locação. Preços não são diretamente comparáveis.</div></div>` : ''}</section>
      <div class="tbl-wrap" style="margin-bottom:16px"><table class="tbl"><thead><tr><th>Critério</th>${ps.map((p, i) => `<th><div class="row" style="flex-wrap:nowrap;gap:8px"><img class="thumb" src="${photoUrl(p)}" alt=""><div><b style="color:var(--text);text-transform:none;letter-spacing:0;font-size:.85rem">${letters[i]} · ${p.code}</b><br><span style="text-transform:none;letter-spacing:0">${esc(p.hood)}, ${esc(p.city)}</span></div></div></th>`).join('')}</tr></thead>
      <tbody>${rows.map(([l, f, fm, best]) => { const vals = ps.map(f); const target = best === 'min' ? Math.min(...vals) : Math.max(...vals); const allEq = vals.every(v => v === vals[0]);
        return `<tr><td class="muted">${l}</td>${vals.map((v, i) => { const diff = i > 0 && vals[0] ? (v / vals[0] - 1) * 100 : null; return `<td class="num">${!allEq && v === target ? `<span class="best">${fm(v)}</span>` : fm(v)}${diff != null && isFinite(diff) && Math.abs(diff) >= .05 && l !== 'vs. referência do bairro' ? ` <span class="xs ${diff > 0 ? 'muted' : 'muted'}">${fmtPct(diff, 0)}</span>` : ''}</td>`; }).join('')}</tr>`; }).join('')}
      <tr><td class="muted">Localização</td>${ps.map(p => `<td class="small">${esc(p.hood)}<br><span class="muted">${esc(p.city)} · ${p.state}</span></td>`).join('')}</tr>
      <tr><td class="muted">Comodidades</td>${ps.map(p => `<td class="xs">${esc(p.features.slice(0, 5).join(', ')) || '—'}</td>`).join('')}</tr></tbody></table></div>
      <div class="split"><section class="panel"><div class="panel-head"><div><h2>Índice comparativo</h2><div class="sub">Imóvel A = 100</div></div></div><div class="chart-box"><canvas id="c-chart"></canvas></div></section>
      <section class="panel"><div class="panel-head"><h2>Vantagens e limitações</h2></div><div class="stack" style="gap:12px">${ps.map((p, i) => { const pro = [], con = [];
        const m2s = ps.map(x => isRent(x) ? x.price / x.area : pricePerM2(x)); const myM2 = m2s[i];
        if (myM2 === Math.min(...m2s)) pro.push('Menor preço por m²'); if (myM2 === Math.max(...m2s)) con.push('Maior preço por m²');
        if (p.area === Math.max(...ps.map(x => x.area))) pro.push('Maior área'); if (p.parking === Math.max(...ps.map(x => x.parking)) && p.parking > 0) pro.push('Mais vagas');
        if (p.apprec === Math.max(...ps.map(x => x.apprec))) pro.push('Maior valorização estimada');
        const d = vsRef(p); if (d != null && d < -3) pro.push(`${fmtNum(-d, 1)}% abaixo da referência do bairro`); if (d != null && d > 3) con.push(`${fmtNum(d, 1)}% acima da referência do bairro`);
        if (p.condo === Math.max(...ps.map(x => x.condo)) && p.condo > 0) con.push('Condomínio mais alto'); if (p.status !== 'disponivel') con.push('Status: ' + statusLabel(p.status).toLowerCase());
        return `<div><b class="small">${letters[i]} · ${p.code}</b><div class="feat-list" style="margin-top:6px">${pro.map(x => `<span class="chip" style="color:var(--good);background:var(--good-soft);border-color:transparent">${ic('check')}${esc(x)}</span>`).join('')}${con.map(x => `<span class="chip" style="color:var(--bad);background:var(--bad-soft);border-color:transparent">${ic('alert')}${esc(x)}</span>`).join('')}${!pro.length && !con.length ? '<span class="xs muted">Sem destaques relativos.</span>' : ''}</div></div>`; }).join('')}</div></section></div>`;
  },
  regioes() {
    const groups = {};
    S.props.forEach(p => { const k = p.hood + '|' + p.city; (groups[k] = groups[k] || { hood: p.hood, city: p.city, ps: [] }).ps.push(p); });
    const rows = Object.values(groups).map(g => { const sale = g.ps.filter(p => !isRent(p)); return Object.assign(g, { n: g.ps.length, avgM2: sale.length ? sale.reduce((a, p) => a + pricePerM2(p), 0) / sale.length : null, min: Math.min(...g.ps.map(p => p.price)), max: Math.max(...g.ps.map(p => p.price)), v12: g.ps.reduce((a, p) => a + var12(p), 0) / g.ps.length, ref: REF_M2[g.hood] }); }).sort((a, b) => (b.avgM2 || 0) - (a.avgM2 || 0));
    if (!UI.market.region || !rows.some(r => r.hood === UI.market.region)) UI.market.region = rows[0] && rows[0].hood;
    const sel = rows.find(r => r.hood === UI.market.region);
    this._rows = rows;
    return `<div class="note" style="margin-bottom:14px">${ic('info')}<div>Médias calculadas sobre os ${S.props.length} imóveis cadastrados na plataforma.</div></div>
      <div class="split" style="margin-bottom:16px"><section class="panel"><div class="panel-head"><div><h2>Preço médio por m² da base</h2><div class="sub">Imóveis à venda · clique em uma barra para detalhar o bairro</div></div></div><div class="chart-box lg"><canvas id="r-chart"></canvas></div></section>
      <section class="panel" id="r-detail">${sel ? `<div class="panel-head"><div><h2>${esc(sel.hood)}</h2><div class="sub">${esc(sel.city)} · ${sel.n} imóvel(is) na base</div></div></div>
        <dl class="kv"><dt>Preço médio/m² (base)</dt><dd>${sel.avgM2 ? fmtBRL(sel.avgM2) : '—'}</dd><dt>Referência do bairro</dt><dd>${sel.ref ? fmtBRL(sel.ref) : '—'}</dd><dt>Faixa de preços</dt><dd>${fmtShort(sel.min)} a ${fmtShort(sel.max)}</dd><dt>Variação 12m estimada</dt><dd class="${sel.v12 >= 0 ? 'up' : 'down'}">${fmtPct(sel.v12)}</dd></dl>
        <div class="chart-box sm" style="margin-top:12px"><canvas id="r-types"></canvas></div>
        <div style="margin-top:10px">${sel.ps.map(p => `<div class="list-item clickable" data-open="${p.id}" style="padding-inline:6px"><img class="thumb" src="${photoUrl(p)}" alt=""><div class="grow"><div class="t small">${esc(p.title)}</div><div class="xs muted">${fmtBRL(p.price)}${isRent(p) ? '/mês' : ''}</div></div></div>`).join('')}</div>` : ''}</section></div>
      <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Bairro</th><th>Cidade</th><th class="r">Imóveis</th><th class="r">Preço médio/m²</th><th class="r">Faixa de preços</th><th>Tipos</th><th class="r">Var. 12m (est.)</th></tr></thead><tbody>
      ${rows.map(r => `<tr class="click" data-region="${esc(r.hood)}"><td><b>${esc(r.hood)}</b></td><td class="muted">${esc(r.city)}</td><td class="r">${r.n}</td><td class="r">${r.avgM2 ? fmtBRL(r.avgM2) : '—'}</td><td class="r small">${fmtShort(r.min)} – ${fmtShort(r.max)}</td><td class="small">${[...new Set(r.ps.map(p => p.type))].join(', ')}</td><td class="r ${r.v12 >= 0 ? 'up' : 'down'}">${fmtPct(r.v12)}</td></tr>`).join('')}</tbody></table></div>`;
  },
  invest() {
    const m = UI.market; let p = getProp(m.propId); if (!p || isRent(p)) p = S.props.find(x => !isRent(x));
    if (!m.inv || m.inv._for !== p.id) {
      const rentRef = refRent(p) ? Math.round(refRent(p) * p.area / 50) * 50 : Math.round(p.price * .0042 / 50) * 50;
      m.inv = { _for: p.id, price: p.price, rent: rentRef, costs: Math.round((p.iptu / 12 + 250) / 10) * 10, vac: 8, init: Math.round(p.price * .045 / 1000) * 1000, years: 10, g: p.apprec, reaj: 4 };
    }
    const v = m.inv;
    const f = (k, l, hint, step = 1, num = true) => `<label class="field"><span>${l}</span><input class="input num" data-inv="${k}" ${num ? 'inputmode="numeric"' : ''} value="${k === 'g' || k === 'reaj' || k === 'vac' ? v[k] : fmtNum(v[k])}">${hint ? `<span class="xs faint">${hint}</span>` : ''}</label>`;
    return `<div class="split-r">
      <section class="panel"><div class="panel-head"><h2>Premissas</h2></div><div class="stack" style="gap:12px">
        <label class="field"><span>Preencher a partir do imóvel</span><select class="input" id="i-prop">${propOptions(p.id, x => !isRent(x))}</select></label>
        ${f('price', 'Preço de aquisição (R$)')}${f('rent', 'Aluguel mensal estimado (R$)', 'Sugestão: área × referência de aluguel do bairro')}
        ${f('costs', 'Custos mensais do proprietário (R$)', 'IPTU mensal + manutenção (condomínio fica com o inquilino)')}
        <div class="form-grid keep2">${f('vac', 'Vacância (% do ano)')}${f('init', 'Despesas iniciais (R$)', 'ITBI, cartório')}</div>
        <div class="form-grid keep2">${f('years', 'Prazo (anos)')}${f('g', 'Valorização anual (%)', 'Hipotética')}</div>
        ${f('reaj', 'Reajuste anual do aluguel e custos (%)')}
        <div class="formula">Rend. bruto = aluguel × 12 ÷ preço<br>Rend. líquido = (aluguel × 12 × (1 − vacância) − custos × 12) ÷ (preço + despesas)<br>Valor final = preço × (1 + valorização)^prazo</div>
      </div></section>
      <div class="stack">
        <section class="panel"><div class="grid g4" style="gap:10px" id="i-kpis"></div></section>
        <section class="panel"><div class="panel-head"><div><h2>Projeção patrimonial</h2><div class="sub">Valor do imóvel + caixa acumulado dos aluguéis líquidos</div></div></div><div class="chart-box lg"><canvas id="i-chart"></canvas></div></section>
        <section class="panel"><div class="panel-head"><h2>Fluxo de caixa simplificado</h2></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ano</th><th class="r">Aluguel líquido</th><th class="r">Caixa acumulado</th><th class="r">Valor do imóvel</th><th class="r">Patrimônio total</th></tr></thead><tbody id="i-tbody"></tbody></table></div>
        <div class="note warn" style="margin-top:12px">${ic('alert')}<div>Simulação simplificada: não considera imposto de renda sobre aluguel, ganho de capital, financiamento, taxa de administração, corretagem na venda ou inflação. Use como apoio à conversa, não como recomendação de investimento.</div></div></section>
      </div></div>`;
  },
  mount(root) {
    const m = UI.market;
    $$('[data-tab]', root).forEach(b => b.onclick = () => { m.tab = b.dataset.tab; App.refresh(); });
    if ($('.empty', root)) return;
    const C = SERIES();
    if (m.tab === 'valor') {
      const p = getProp(m.propId);
      $('#v-prop', root).onchange = e => { m.propId = e.target.value; m.v0 = null; m.rate = null; App.refresh(); };
      const v0 = $('#v-v0', root); v0.oninput = () => { const n = +v0.value.replace(/\D/g, ''); m.v0 = n; v0.value = n ? fmtNum(n) : ''; calc(); };
      $('#v-rate', root).oninput = e => { m.rate = +e.target.value; $('#v-rate-o', root).textContent = fmtPct(m.rate); calc(); };
      $('#v-years', root).oninput = e => { m.years = +e.target.value; $('#v-years-o', root).textContent = m.years + ' ano' + (m.years > 1 ? 's' : ''); calc(); };
      $$('[data-sc]', root).forEach(b => b.onclick = () => { m.scenario = b.dataset.sc; $$('[data-sc]', root).forEach(x => x.classList.toggle('on', x === b)); calc(); });
      const labels = () => Array.from({ length: m.years + 1 }, (_, i) => i === 0 ? 'Hoje' : 'Ano ' + i);
      const ch = chart($('#v-chart', root), { type: 'line', data: { labels: [], datasets: Object.entries(SCEN).map(([k, [l]], i) => ({ label: l, data: [], borderColor: [cssVar('--warn'), C[0], cssVar('--good')][i], backgroundColor: [cssVar('--warn'), C[0], cssVar('--good')][i], tension: .25, borderWidth: 2, pointRadius: 2 })) },
        options: { interaction: { mode: 'index', intersect: false }, plugins: { tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + fmtBRL(c.parsed.y) } } }, scales: { x: { grid: { display: false } }, y: { ticks: { callback: v => fmtShort(v) }, grid: { color: cssVar('--line') } } } } });
      function calc() {
        const v0n = m.v0 || 0, base = m.rate, n = m.years;
        const sc = Object.fromEntries(Object.entries(SCEN).map(([k, [, d]]) => [k, base + d]));
        const sel = sc[m.scenario]; const final = v0n * Math.pow(1 + sel / 100, n);
        $('#v-head-l', root).textContent = `${SCEN[m.scenario][0]} · ${fmtPct(sel)} a.a. · ${n} ano${n > 1 ? 's' : ''}`;
        $('#v-head', root).textContent = fmtBRL(final);
        $('#v-formula', root).innerHTML = `${fmtBRL(v0n)} × (1 ${sel >= 0 ? '+' : '−'} ${fmtNum(Math.abs(sel) / 100, 3)})<sup>${n}</sup> = <b style="color:var(--text)">${fmtBRL(final)}</b>`;
        $('#v-cards', root).innerHTML = Object.entries(sc).map(([k, r]) => { const fv = v0n * Math.pow(1 + r / 100, n); const g = (fv / v0n - 1) * 100; return `<div class="sc" style="${k === m.scenario ? 'border-color:var(--accent);background:var(--accent-soft)' : ''}"><span>${SCEN[k][0]} · ${fmtPct(r)} a.a.</span><b>${fmtShort(fv)}</b><div class="xs ${g >= 0 ? 'up' : 'down'}">${fmtPct(g)} acumulado</div></div>`; }).join('');
        if (ch) { ch.data.labels = labels(); Object.keys(SCEN).forEach((k, i) => { ch.data.datasets[i].data = project(v0n, sc[k], n).map(Math.round); ch.data.datasets[i].borderWidth = k === m.scenario ? 3.2 : 1.6; }); ch.update(); }
        const proj = project(v0n, sel, n);
        $('#v-tab-sc', root).textContent = `${SCEN[m.scenario][0]} · ${fmtPct(sel)} a.a.`;
        $('#v-tbody', root).innerHTML = proj.map((x, i) => `<tr><td>${i === 0 ? 'Hoje' : 'Ano ' + i}</td><td class="r"><b>${fmtBRL(x)}</b></td><td class="r ${x - v0n >= 0 ? 'up' : 'down'}">${fmtBRL(x - v0n)}</td><td class="r">${fmtPct(v0n ? (x / v0n - 1) * 100 : 0)}</td></tr>`).join('');
      }
      calc();
      chart($('#v-hist', root), { type: 'line', data: { labels: monthLabels(24), datasets: [{ data: history(p, 24), borderColor: C[1], backgroundColor: C[1] + '22', fill: true, tension: .3, pointRadius: 0, borderWidth: 2 }] }, options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ' ' + fmtBRL(c.parsed.y) + ' (estimado)' } } }, scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } }, y: { ticks: { callback: v => fmtShort(v) }, grid: { color: cssVar('--line') } } } } });
    }
    if (m.tab === 'comparar') {
      $$('[data-cmpi]', root).forEach(s => s.onchange = () => { const i = +s.dataset.cmpi; const ids = m.cmp.slice(); if (s.value) ids[i] = s.value; else ids.splice(i, 1); m.cmp = [...new Set(ids.filter(Boolean))]; App.refresh(); });
      const ps = m.cmp.map(getProp);
      const metrics = [['Preço', p => p.price], ['Área', p => p.area], ['Preço/m²', p => p.price / p.area], ['Quartos', p => p.beds || .0001], ['Vagas', p => p.parking || .0001], ['Valorização est.', p => p.apprec]];
      chart($('#c-chart', root), { type: 'bar', data: { labels: metrics.map(x => x[0]), datasets: ps.map((p, i) => ({ label: ['A', 'B', 'C'][i] + ' · ' + p.code, data: metrics.map(([, f]) => Math.round(f(p) / (f(ps[0]) || 1) * 100)), backgroundColor: C[i], borderRadius: 5, maxBarThickness: 26 })) },
        options: { plugins: { tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + c.parsed.y } } }, scales: { x: { grid: { display: false } }, y: { grid: { color: cssVar('--line') } } } } });
    }
    if (m.tab === 'regioes') {
      const rows = this._rows.filter(r => r.avgM2);
      chart($('#r-chart', root), { type: 'bar', data: { labels: rows.map(r => r.hood), datasets: [{ label: 'Média da base', data: rows.map(r => Math.round(r.avgM2)), backgroundColor: rows.map(r => r.hood === m.region ? cssVar('--accent') : C[0]), borderRadius: 5 }, { label: 'Referência do bairro', data: rows.map(r => r.ref || null), backgroundColor: cssVar('--line-strong'), borderRadius: 5 }] },
        options: { indexAxis: 'y', onClick: (e, els) => { if (els.length) { m.region = rows[els[0].index].hood; App.refresh(); } }, plugins: { tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + fmtBRL(c.parsed.x) + '/m²' } } }, scales: { x: { ticks: { callback: v => 'R$ ' + fmtNum(v / 1000) + 'k' }, grid: { color: cssVar('--line') } }, y: { grid: { display: false } } } } });
      const sel = this._rows.find(r => r.hood === m.region);
      if (sel && $('#r-types', root)) { const types = TYPES.filter(t => sel.ps.some(p => p.type === t)); chart($('#r-types', root), { type: 'doughnut', data: { labels: types, datasets: [{ data: types.map(t => sel.ps.filter(p => p.type === t).length), backgroundColor: C, borderColor: cssVar('--surface'), borderWidth: 3 }] }, options: { cutout: '62%', plugins: { legend: { position: 'right' } } } }); }
      $$('[data-region]', root).forEach(r => r.onclick = () => { m.region = r.dataset.region; App.refresh(); });
      $$('#r-detail [data-open]', root).forEach(b => b.onclick = () => App.go('prop', { id: b.dataset.open }));
    }
    if (m.tab === 'invest') {
      const v = m.inv;
      $('#i-prop', root).onchange = e => { m.propId = e.target.value; m.inv = null; App.refresh(); };
      $$('[data-inv]', root).forEach(el => el.oninput = () => { const k = el.dataset.inv; if (k === 'g' || k === 'reaj' || k === 'vac') { v[k] = parseFloat(el.value.replace(',', '.')) || 0; } else { const n = +el.value.replace(/\D/g, ''); v[k] = n; el.value = n ? fmtNum(n) : ''; } calc(); });
      const ch = chart($('#i-chart', root), { type: 'bar', data: { labels: [], datasets: [{ label: 'Valor do imóvel', data: [], backgroundColor: C[0], stack: 's', borderRadius: 3 }, { label: 'Caixa acumulado', data: [], backgroundColor: C[1], stack: 's', borderRadius: 3 }, { label: 'Investimento inicial', data: [], type: 'line', borderColor: cssVar('--warn'), borderDash: [6, 4], pointRadius: 0, borderWidth: 2 }] },
        options: { plugins: { tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + fmtBRL(c.parsed.y) } } }, scales: { x: { grid: { display: false } }, y: { stacked: true, ticks: { callback: x => fmtShort(x) }, grid: { color: cssVar('--line') } } } } });
      function calc() {
        const N = Math.max(1, Math.min(40, Math.round(v.years || 1)));
        const inv0 = v.price + v.init;
        const gross = v.price ? v.rent * 12 / v.price * 100 : 0;
        const net1 = v.rent * 12 * (1 - v.vac / 100) - v.costs * 12;
        const netY = inv0 ? net1 / inv0 * 100 : 0;
        let cum = 0; const rows = [];
        for (let y = 1; y <= N; y++) { const k = Math.pow(1 + v.reaj / 100, y - 1); const net = v.rent * k * 12 * (1 - v.vac / 100) - v.costs * k * 12; cum += net; const val = v.price * Math.pow(1 + v.g / 100, y); rows.push({ y, net, cum, val, tot: val + cum }); }
        const last = rows[rows.length - 1];
        const cagr = inv0 > 0 && last.tot > 0 ? (Math.pow(last.tot / inv0, 1 / N) - 1) * 100 : 0;
        const payback = net1 > 0 ? inv0 / net1 : null;
        $('#i-kpis', root).innerHTML = `<div class="fact"><span>Rendimento bruto</span><b>${fmtNum(gross, 2)}% a.a.</b></div><div class="fact"><span>Rendimento líquido (ano 1)</span><b class="${netY >= 0 ? '' : 'down'}">${fmtNum(netY, 2)}% a.a.</b></div><div class="fact"><span>Rentabilidade total anual</span><b>${fmtNum(cagr, 2)}% a.a.</b></div><div class="fact"><span>Patrimônio em ${N} anos</span><b>${fmtShort(last.tot)}</b></div>
          <div class="fact"><span>Investimento inicial</span><b>${fmtShort(inv0)}</b></div><div class="fact"><span>Aluguel líquido/mês (ano 1)</span><b>${fmtBRL(net1 / 12)}</b></div><div class="fact"><span>Payback só com aluguel</span><b>${payback ? fmtNum(payback, 1) + ' anos' : '—'}</b></div><div class="fact"><span>Ganho total</span><b class="${last.tot - inv0 >= 0 ? 'up' : 'down'}">${fmtShort(last.tot - inv0)}</b></div>`;
        if (ch) { ch.data.labels = rows.map(r => 'Ano ' + r.y); ch.data.datasets[0].data = rows.map(r => Math.round(r.val)); ch.data.datasets[1].data = rows.map(r => Math.round(r.cum)); ch.data.datasets[2].data = rows.map(() => inv0); ch.update(); }
        $('#i-tbody', root).innerHTML = rows.map(r => `<tr><td>Ano ${r.y}</td><td class="r ${r.net >= 0 ? '' : 'down'}">${fmtBRL(r.net)}</td><td class="r">${fmtBRL(r.cum)}</td><td class="r">${fmtBRL(r.val)}</td><td class="r"><b>${fmtBRL(r.tot)}</b></td></tr>`).join('');
      }
      calc();
    }
  }
};

const AI_RULES = `Você é o assistente do Nexo Imob, uma plataforma para corretores de imóveis autônomos no Brasil.
Regras:
- Responda sempre em português do Brasil, de forma prática, clara e concisa.
- Use somente os dados de imóveis fornecidos abaixo. Nunca invente características, metragens, preços, vizinhança, distâncias ou endereços. Se faltar uma informação, diga o que falta.
- Não prometa valorização nem dê garantias de retorno; projeções são cenários.
- Não inclua dados pessoais de clientes.
- Formato: texto simples. Pode usar listas com hífen. Não use markdown com asteriscos, cerquilhas ou tabelas.`;
function propForAI(p) {
  if (!p) return 'Nenhum imóvel selecionado.';
  const o = {
    codigo: p.code, titulo: p.title, tipo: p.type, finalidade: isRent(p) ? 'locação' : 'venda', preco: fmtBRL(p.price) + (isRent(p) ? ' por mês' : ''),
    condominio: p.condo ? fmtBRL(p.condo) + '/mês' : 'não informado', iptu_anual: p.iptu ? fmtBRL(p.iptu) : 'não informado',
    area_m2: p.area, area_construida_m2: p.builtArea, quartos: p.beds, suites: p.suites, banheiros: p.baths, vagas: p.parking,
    bairro: p.hood, cidade: p.city, estado: p.state, endereco: p.privateAddress ? 'privado (não divulgar)' : `${p.street}, ${p.number}`,
    mobiliado: p.furnished ? 'sim' : 'não', caracteristicas: p.features, descricao: p.description, status: statusLabel(p.status),
    preco_m2: isRent(p) ? fmtBRL(p.price / p.area, 2) + '/mês' : fmtBRL(pricePerM2(p)),
    contato_autorizado: p.contactAuthorized && p.contact ? p.contact : 'nenhum'
  };
  return JSON.stringify(o, null, 1);
}
function dashSummaryForAI() {
  const mine = myProps(); const sale = mine.filter(p => !isRent(p) && activeStatus(p));
  return `Resumo do painel do corretor: ${mine.length} imóveis na carteira (${sale.length} à venda ativos, valor somado ${fmtBRL(sale.reduce((a, p) => a + p.price, 0))}); ${S.clients.length} clientes no CRM; ${S.opps.length} oportunidades; ${S.materials.length} materiais de divulgação criados. Carteira: ${mine.map(p => `${p.code} (${p.type}, ${p.hood}, ${fmtShort(p.price)}${isRent(p) ? '/mês' : ''}, ${statusLabel(p.status)})`).join('; ')}.`;
}
function aiErrorText(e) {
  const c = e && e.code;
  if (c === 'not_granted' || c === 'sampling_disabled' || c === 'not_declared' || c === 'capability_disabled' || c === 'capability_removed') { Cap.sampleDenied = true; return 'A IA não foi autorizada nesta visualização. Use o gerador por modelo ou permita o uso da IA quando solicitado.'; }
  if (c === 'rate_limited') return 'Muitas solicitações em pouco tempo ou limite de uso atingido. Aguarde um pouco e tente de novo.';
  if (c === 'session_expired') return 'Sua sessão expirou. Entre novamente.';
  if (c === 'refused') return 'O modelo recusou este pedido. Reformule a solicitação.';
  if (c === 'cancelled') return '';
  return 'A geração foi interrompida por uma falha temporária. Tente novamente.';
}

const AD_FORMATS = ['Instagram', 'Facebook', 'WhatsApp', 'Portal imobiliário', 'Anúncio curto', 'Descrição completa', 'Roteiro de vídeo'];
const AD_TONES = ['Profissional', 'Sofisticado', 'Objetivo', 'Persuasivo'];
function templateAd(p, format, tone) {
  const rent = isRent(p); const price = fmtBRL(p.price) + (rent ? '/mês' : '');
  const loc = `${p.hood}, ${p.city}`;
  const sp = [`${fmtNum(p.area)} m²`, p.beds ? `${p.beds} quarto${p.beds > 1 ? 's' : ''}${p.suites ? ` (${p.suites} suíte${p.suites > 1 ? 's' : ''})` : ''}` : '', `${p.baths} banheiro${p.baths > 1 ? 's' : ''}`, p.parking ? `${p.parking} vaga${p.parking > 1 ? 's' : ''}` : ''].filter(Boolean);
  const feats = (p.furnished ? ['mobiliado'] : []).concat(p.features.map(f => f.toLowerCase()));
  const featTxt = feats.length ? feats.slice(0, 6).join(', ') : '';
  const opener = { Profissional: `${p.type} ${rent ? 'para locação' : 'à venda'} em ${loc}.`, Sofisticado: `Conheça este ${p.type.toLowerCase()} em ${p.hood}, pensado para quem valoriza conforto e localização.`, Objetivo: `${p.type} em ${loc}: ${sp.join(', ')}.`, Persuasivo: `Oportunidade em ${p.hood}: ${p.type.toLowerCase()} ${rent ? 'para alugar' : 'à venda'} com ${sp[1] || sp[0]}.` }[tone];
  const contact = p.contactAuthorized && p.contact ? p.contact : S.settings.phone;
  const cta = { Profissional: 'Entre em contato para agendar uma visita.', Sofisticado: 'Agende uma visita reservada.', Objetivo: 'Agende sua visita.', Persuasivo: 'Fale comigo hoje e garanta sua visita.' }[tone];
  const hashtag = s => '#' + s.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-zA-Z0-9]/g, '');
  switch (format) {
    case 'Instagram': return `${opener}\n\n${sp.join(' | ')}\n${featTxt ? 'Destaques: ' + featTxt + '.\n' : ''}${rent ? 'Aluguel' : 'Valor'}: ${price}\n\n${cta} Link na bio ou direct.\n\n${hashtag(p.hood)} ${hashtag(p.city)} ${hashtag(p.type)} ${rent ? '#AluguelDeImoveis' : '#ImovelAVenda'} #CorretorDeImoveis`;
    case 'Facebook': return `${opener}\n\n${p.description}\n\n${sp.map(s => '- ' + s).join('\n')}${featTxt ? '\n- ' + feats.slice(0, 6).join('\n- ') : ''}\n\n${rent ? 'Aluguel' : 'Valor'}: ${price}${p.condo ? `\nCondomínio: ${fmtBRL(p.condo)}` : ''}\n\n${cta} ${contact}`;
    case 'WhatsApp': return `Olá! Tenho um imóvel que pode te interessar:\n\n${p.type} em ${loc}\n${sp.join(', ')}\n${featTxt ? featTxt.charAt(0).toUpperCase() + featTxt.slice(1) + '\n' : ''}${rent ? 'Aluguel' : 'Valor'}: ${price}\n\nPosso te enviar mais fotos ou agendar uma visita?`;
    case 'Portal imobiliário': return `${p.title}\n\n${p.description}\n\nCaracterísticas: ${sp.join(', ')}${featTxt ? ', ' + featTxt : ''}.\n${p.condo ? `Condomínio: ${fmtBRL(p.condo)}/mês. ` : ''}${p.iptu ? `IPTU: ${fmtBRL(p.iptu)}/ano.` : ''}\nLocalização: ${loc}.\nCódigo: ${p.code}.`;
    case 'Anúncio curto': return `${p.type} em ${p.hood} · ${sp.slice(0, 3).join(' · ')} · ${price}. ${cta}`;
    case 'Descrição completa': return `${opener}\n\n${p.description}\n\nFicha técnica\n- Área: ${fmtNum(p.area)} m²${p.builtArea && p.builtArea !== p.area ? ` (${fmtNum(p.builtArea)} m² construídos)` : ''}\n- Quartos: ${p.beds}${p.suites ? ` (${p.suites} suíte${p.suites > 1 ? 's' : ''})` : ''}\n- Banheiros: ${p.baths}\n- Vagas: ${p.parking}\n${p.condo ? `- Condomínio: ${fmtBRL(p.condo)}/mês\n` : ''}${p.iptu ? `- IPTU: ${fmtBRL(p.iptu)}/ano\n` : ''}${feats.length ? `- Diferenciais: ${feats.join(', ')}\n` : ''}\n${rent ? 'Aluguel' : 'Valor'}: ${price}\n${cta}`;
    case 'Roteiro de vídeo': return `Roteiro (30 segundos)\n\nCena 1 (0-5s): fachada ou vista principal.\nTexto na tela: ${p.type} em ${p.hood}\n\nCena 2 (5-12s): ambientes sociais.\nNarração: "${sp.slice(0, 2).join(', ')}${featTxt ? ', com ' + feats.slice(0, 2).join(' e ') : ''}."\n\nCena 3 (12-20s): quartos e detalhes.\nTexto na tela: ${sp.slice(1).join(' · ')}\n\nCena 4 (20-26s): destaques do condomínio ou da região${featTxt ? ' (' + feats.slice(2, 4).join(', ') + ')' : ''}.\n\nCena 5 (26-30s): cartela final.\nTexto: ${price} · ${cta}\nContato: ${contact}`;
  }
  return opener;
}

let CHAT_CTL = null;
function mountAssist(root) {
  const st = UI.studio; const log = $('#chat-log', root); log.scrollTop = log.scrollHeight;
  $('#as-prop', root).onchange = e => { st.propId = e.target.value; App.refresh(); };

/* --- Motor de compatibilidade (determinístico e auditável) --- */
const GREATER_BH = ['Belo Horizonte', 'Nova Lima'];
const WANT_SYN = {
  'Área de lazer': p => ['Piscina', 'Playground', 'Salão de festas', 'Academia', 'Área gourmet'].some(f => p.features.includes(f)),
  'Varanda': p => p.features.includes('Varanda') || p.features.includes('Varanda gourmet'),
  'Mobiliado': p => !!p.furnished,
  'Condomínio fechado': p => p.features.includes('Condomínio fechado')
};
const hasWant = (p, w) => WANT_SYN[w] ? WANT_SYN[w](p) : p.features.includes(w);
function clientHoods(c) { return (c.region || '').split(',').map(s => s.trim()).filter(Boolean); }
const CRIT = [
  { k: 'preco', l: 'Faixa de preço e orçamento', w: 25 },
  { k: 'local', l: 'Localização e bairros', w: 25 },
  { k: 'area', l: 'Metragem', w: 15 },
  { k: 'quartos', l: 'Quartos e suítes', w: 15 },
  { k: 'vagas', l: 'Vagas de garagem', w: 10 },
  { k: 'tipo', l: 'Tipo de imóvel', w: 5 },
  { k: 'outras', l: 'Outras preferências', w: 5 }
];
const CRIT_LABEL = Object.fromEntries(CRIT.map(c => [c.k, c.l]));
function defaultWeights() { return Object.fromEntries(CRIT.map(c => [c.k, c.w])); }
const PRIO_CRIT = { preco: 'preco', localizacao: 'local', tamanho: 'area', caracteristicas: 'outras' };
const RELATED_TYPES = [['Apartamento', 'Cobertura'], ['Apartamento', 'Studio']];
// Regra de "um a menos": atende = 1; falta 1 = 0,5; faltam 2 = 0,15; mais = 0
// Atende exatamente ou 1 a mais = 1; 2+ a mais = 0,85 (paga por espaço que não precisa); falta 1 = 0,4; faltam 2 = 0,1
const countScore = (have, need) => have >= need ? (have - need >= 2 ? .85 : 1) : have === need - 1 ? .4 : have === need - 2 ? .1 : 0;
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;
function critEval(c, p) {
  const money = v => isRent(p) ? fmtBRL(v) + '/mês' : fmtShort(v);
  const out = {};
  // 1. Preço
  if (c.budget > 0) {
    const pref = (c.budgetMin ? `${money(c.budgetMin)} a ` : 'até ') + money(c.budget) + (c.budgetHard ? ' (máximo rígido)' : '');
    let s, note, elim = false;
    const ratio = p.price / c.budget;
    if (p.price > c.budget) {
      const over = ratio - 1;
      if (c.budgetHard) { s = 0; elim = true; note = `${fmtNum(over * 100, 1)}% acima do orçamento máximo rígido`; }
      else { s = clamp(.75 - over * 5, 0, .75); note = `${fmtNum(over * 100, 1)}% acima do máximo (a partir de 0,75, cada 1% acima tira 0,05)`; }
    } else if (c.budgetMin && p.price < c.budgetMin) {
      const under = 1 - p.price / c.budgetMin; s = clamp(1 - under * 1.5, .4, 1); note = `${fmtNum(under * 100, 1)}% abaixo do mínimo da faixa (pode indicar padrão inferior)`;
    } else if (ratio > .9) {
      s = 1 - (ratio - .9) * 2.5; note = `Dentro da faixa, mas usa ${fmtNum(ratio * 100, 0)}% do orçamento (pouca folga para negociar)`;
    } else { s = 1; note = `Dentro da faixa, com folga (${fmtNum(ratio * 100, 0)}% do máximo)`; }
    if (c.goal === 'investimento' && !isRent(p) && !elim) {
      const d = vsRef(p);
      if (d != null) { const r = d <= -5 ? 1 : d <= 0 ? .8 : d <= 5 ? .5 : .2; s = .7 * s + .3 * r; note += `; investidor: preço ${fmtNum(Math.abs(d), 1)}% ${d > 0 ? 'acima' : 'abaixo'} da referência do bairro (30% do critério)`; }
    }
    out.preco = { s, pref, val: money(p.price), note, elim };
  }
  // 2. Localização
  const hoods = clientHoods(c);
  if (hoods.length) {
    const pos = hoods.findIndex(h => h.toLowerCase() === p.hood.toLowerCase()); const inList = pos >= 0;
    const prefS = [1, .8, .65, .55][Math.min(pos, 3)];
    const clientCities = new Set([c.city].concat(Object.keys(CITIES).filter(ci => CITIES[ci].hoods.some(h => hoods.map(x => x.toLowerCase()).includes(h.toLowerCase()))))).add('');
    const sameRegion = clientCities.has(p.city) || ([...clientCities].some(ci => GREATER_BH.includes(ci)) && GREATER_BH.includes(p.city));
    out.local = inList ? { s: prefS, note: pos === 0 ? '1º bairro da lista do cliente' : `${pos + 1}º bairro na ordem de preferência do cliente` } : sameRegion ? { s: .3, note: 'Bairro fora da lista, mesma região' } : { s: 0, note: 'Fora da área de busca do cliente (outra cidade)', elim: true };
    Object.assign(out.local, { pref: hoods.join(', '), val: `${p.hood}, ${p.city}` });
  } else if (c.city) {
    const s = p.city === c.city ? 1 : (GREATER_BH.includes(p.city) && GREATER_BH.includes(c.city)) ? .5 : 0;
    out.local = { s, pref: c.city + ' (sem bairros definidos)', val: `${p.hood}, ${p.city}`, note: s === 1 ? 'Na cidade desejada' : s ? 'Cidade vizinha' : 'Fora da área de busca do cliente (outra cidade)', elim: s === 0 };
  }
  // 3. Metragem
  if (c.minArea > 0) {
    const r = p.area / c.minArea; const s = r >= 1 ? (r > 1.6 ? .85 : 1) : clamp((r - .75) / .25, 0, 1) * .8;
    out.area = { s, pref: `mín. ${fmtNum(c.minArea)} m²`, val: `${fmtNum(p.area)} m²`, note: r >= 1 ? (r > 1.6 ? `${fmtNum((r - 1) * 100, 0)}% maior que o necessário` : 'Atende à metragem mínima') : `${fmtNum((1 - r) * 100, 0)}% menor que o mínimo (zera com 25% a menos)` };
  }
  // 4. Quartos e suítes

    const bs = c.beds > 0 ? countScore(p.beds, c.beds) : null, ss = c.suites > 0 ? countScore(p.suites, c.suites) : null;
    const s = bs != null && ss != null ? .7 * bs + .3 * ss : bs != null ? bs : ss;
    out.quartos = { s, pref: [c.beds ? plural(c.beds, 'quarto', 'quartos') + '+' : '', c.suites ? plural(c.suites, 'suíte', 'suítes') + '+' : ''].filter(Boolean).join(', '), val: `${plural(p.beds, 'quarto', 'quartos')}, ${plural(p.suites, 'suíte', 'suítes')}`, note: s === 1 ? 'Atende' : (p.beds - (c.beds || 0) >= 2 || p.suites - (c.suites || 0) >= 2) && s >= .85 ? 'Mais cômodos que o necessário' : bs != null && ss != null ? 'Quartos valem 70% e suítes 30% do critério' : 'Faltando unidades' };
  }
  // 5. Vagas
  if (c.parking > 0) { const s = countScore(p.parking, c.parking); out.vagas = { s, pref: plural(c.parking, 'vaga', 'vagas') + '+', val: plural(p.parking, 'vaga', 'vagas'), note: s === 1 ? 'Atende' : p.parking > c.parking ? 'Mais vagas que o necessário' : `${c.parking - p.parking} a menos` }; }
  // 6. Tipo
  if (c.ptype) {
    const eq = c.ptype === p.type, rel = RELATED_TYPES.some(([x, y]) => (x === c.ptype && y === p.type) || (y === c.ptype && x === p.type));
    const s = eq ? 1 : rel ? .5 : 0; const elim = !eq && !rel && c.typeHard;
    out.tipo = { s, pref: c.ptype + (c.typeHard ? ' (obrigatório)' : ''), val: p.type, note: eq ? 'Tipo desejado' : rel ? 'Tipo próximo' : elim ? 'Tipo obrigatório não atendido' : 'Tipo diferente', elim };
  }
  // 7. Outras preferências
  const items = (c.wants || []).map(w => ({ t: w, ok: hasWant(p, w) }));
  if (c.condition === 'novo' || c.condition === 'usado') items.push({ t: 'Imóvel ' + c.condition, ok: p.condition === c.condition });
  if (items.length) { const ok = items.filter(i => i.ok); out.outras = { s: ok.length / items.length, pref: items.map(i => i.t).join(', '), val: ok.length ? ok.map(i => i.t).join(', ') : 'Nenhuma', note: `${ok.length} de ${items.length} atendidas`, items }; }
  return out;
}
function matchEval(c, p, weights) {

function makePDF(canvases, title = 'Ficha comercial') {

  const put = x => { const u = typeof x === 'string' ? enc.encode(x) : x; chunks.push(u); pos += u.length; };

  obj(1, () => put('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => put(`<< /Type /Pages /Kids [${kids}] /Count ${n} >>`));
  const safeTitle = title.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[()\\]/g, '');
  obj(3, () => put(`<< /Title (${safeTitle}) /Producer (Nexo Imob) >>`));
  canvases.forEach((cv, i) => {
    const pg = 4 + i * 3, ct = pg + 1, im = pg + 2;
    const jpg = dataUrlBytes(cv.toDataURL('image/jpeg', .88));
    const content = `q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    obj(pg, () => put(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${im} 0 R >> >> /Contents ${ct} 0 R >>`));
    obj(ct, () => { put(`<< /Length ${content.length} >>\nstream\n`); put(content); put('\nendstream'); });
    obj(im, () => { put(`<< /Type /XObject /Subtype /Image /Width ${cv.width} /Height ${cv.height} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>\nstream\n`); put(jpg); put('\nendstream'); });
  });
  const total = 4 + n * 3; const xref = pos;
  let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let i = 1; i < total; i++) x += String(offsets[i]).padStart(10, '0') + ' 00000 n \n';
  put(x); put(`trailer\n<< /Size ${total} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(chunks, { type: 'application/pdf' });
}

    if (onSaved) onSaved(cid); else App.refresh();

}

/* ===== Compartilhar pelo WhatsApp ===== */
function shareModal(propId, clientId, extra) {
  const p = getProp(propId); if (!p) return;

  const link = publicLink(p, extra || { photos: p.photos && p.photos.length ? [] : photoList(p).map((_, i) => i) });
  const cs = S.clients.filter(c => c.phone || c.email);
  const m = modal({ title: 'Compartilhar pelo WhatsApp', wide: true, body: `
    <div class="list-item" style="padding-top:0"><img class="thumb" src="${photoUrl(p)}" alt=""><div class="grow"><div class="t small">${esc(p.title)}</div><div class="xs muted">${p.code} · ${fmtBRL(p.price)}${isRent(p) ? '/mês' : ''}</div></div></div>
    <div class="form-grid" style="margin:12px 0">
      <label class="field"><span>Enviar para (opcional)</span><select class="input" id="sh-client"><option value="">Escolher contato no WhatsApp</option>${cs.map(c => `<option value="${c.id}" ${client && client.id === c.id ? 'selected' : ''}>${esc(c.name)}${c.phone ? ' · ' + esc(c.phone) : ''}</option>`).join('')}</select></label>
      <label class="field"><span>Link público do imóvel</span><div class="row" style="flex-wrap:nowrap;gap:6px"><input class="input mono" id="sh-link" value="${esc(link)}" readonly style="font-size:.74rem"><a class="btn btn-ghost btn-sm" href="${esc(link)}" target="_blank" rel="noopener" title="Abrir página pública">${ic('arrowUR')}</a></div></label></div>
    <label class="field"><span>Mensagem (pode editar)</span><textarea class="input" id="sh-text" rows="11"></textarea></label>
    <div class="note" style="margin-top:12px">${ic('info')}<div>O WhatsApp abre com a mensagem pronta e o envio é confirmado por você. Nenhuma mensagem é enviada automaticamente. A página pública mostra só dados comerciais: sem endereço exato, observações internas ou dados de clientes.${p.photos && p.photos.length ? ' As fotos enviadas por você não vão no link; a página usa imagens ilustrativas. Para mandar as fotos reais, use a ficha em PDF.' : ''}</div></div>`,
    foot: `<button class="btn btn-ghost" id="sh-copy">${ic('copy')}Copiar mensagem</button><a class="btn btn-accent" id="sh-wa" target="_blank" rel="noopener">${ic('message')}Abrir no WhatsApp</a>` });
  const ta = $('#sh-text', m), wa = $('#sh-wa', m);
  const upd = () => { wa.href = waLink(ta.value, client && client.phone); };
  const regen = () => { ta.value = shareText(p, client, link); upd(); };
  regen();
  ta.oninput = upd;
  $('#sh-client', m).onchange = e => { client = e.target.value ? getClient(e.target.value) : null; regen(); };
  $('#sh-copy', m).onclick = () => copyText(ta.value);
  wa.onclick = () => { logActivity('message', `${p.code} compartilhado pelo WhatsApp${client ? ' com ' + client.name : ''}`); Store.save(); toast('WhatsApp aberto em outra aba. Confirme o envio por lá.'); };
}

          <h1 style="font-size:1.55rem">${esc(p.title)}</h1>
          <div class="loc muted row" style="gap:4px;margin-top:6px">${ic('pin')}${esc(p.hood)}, ${esc(p.city)} · ${esc(p.state)}</div>
          <div class="facts" style="margin:18px 0">${[['Área', fmtNum(p.area) + ' m²'], ['Quartos', p.beds], ['Suítes', p.suites], ['Banheiros', p.baths], ['Vagas', p.parking], ['Área construída', fmtNum(p.builtArea || p.area) + ' m²'], ['Condomínio', p.condo ? fmtBRL(p.condo) : '—'], ['IPTU (anual)', p.iptu ? fmtBRL(p.iptu) : '—']].map(([l, v]) => `<div class="fact"><span>${l}</span><b>${v}</b></div>`).join('')}</div>
          <h2 style="margin-bottom:8px">Sobre o imóvel</h2><p class="desc">${esc(p.description)}</p>
          ${p.features.length || p.furnished ? `<h2 style="margin:20px 0 8px">Diferenciais</h2><div class="feat-list">${(p.furnished ? ['Mobiliado'] : []).concat(p.features).map(x => `<span class="chip">${ic('check')}${esc(x)}</span>`).join('')}</div>` : ''}
        </section>
        <aside class="pub-card">
          <div class="xs muted">${isRent(p) ? 'Aluguel' : 'Valor'}</div><div class="big-num" style="margin:2px 0 4px">${price}</div>
          <div class="small muted num">${isRent(p) ? fmtBRL(p.price / p.area, 2) + '/m² ao mês' : fmtBRL(p.price / p.area) + '/m²'}</div>
          <div class="divider"></div>
          <b>${esc(broker)}</b>${b.c ? `<div class="xs muted">${esc(b.c)}</div>` : ''}
          ${b.p ? `<div class="row" style="gap:6px;margin-top:10px;flex-wrap:nowrap"><span class="input num" style="user-select:all;flex:1">${esc(b.p)}</span><button class="btn btn-ghost btn-sm" id="pub-copy">${ic('copy')}</button></div>
          <a class="btn btn-accent" style="width:100%;margin-top:10px" target="_blank" rel="noopener" href="${esc(waLink(`Olá! Vi o imóvel ${p.code} (${p.title}) e gostaria de mais informações.`, b.p))}">${ic('message')}Falar no WhatsApp</a>` : ''}
          <button class="btn btn-ghost" style="width:100%;margin-top:8px" id="pub-pdf">${ic('download')}Baixar ficha em PDF</button>
          <p class="xs faint" style="margin-top:10px">Valores sujeitos a alteração. Endereço exato informado pelo corretor.</p>
        </aside>
      </div>
    </main>
    <footer class="pub-foot">Apresentação gerada pelo Nexo Imob · sem dados privados do proprietário ou do cliente · <button class="link-btn" id="pub-home">Acessar a plataforma</button></footer>
  </div>`;
  let cur = 0;
  const show = i => { cur = (i + ph.length) % ph.length; $('#pg-main').src = ph[cur].src; $('#pg-cap').textContent = (ph[cur].illus ? 'Imagem ilustrativa · ' : '') + ph[cur].label; $$('[data-pt]').forEach((x, k) => x.classList.toggle('on', k === cur)); };
  $$('[data-pg]').forEach(x => x.onclick = () => show(cur + +x.dataset.pg));
  $$('[data-pt]').forEach(x => x.onclick = () => show(+x.dataset.pt));
  if ($('#pub-copy')) $('#pub-copy').onclick = () => copyText(b.p);
  $('#pub-home').onclick = leavePublic;
  $('#pub-pdf').onclick = async () => { const btn = $('#pub-pdf'); btn.disabled = true; try { if (!Cap.ready) await Cap.init(); const { blob } = await fichaBlob(p, { style: o.sty || 'moderno', photos: idx, desc: p.description }, { n: b.n, p: b.p, c: b.c, e: b.e, k: b.k }); await saveFile(fichaName(p), blob); } catch (e) { toast('Não foi possível gerar o PDF.', 'err'); } btn.disabled = false; };
  document.title = p.title + ' · Nexo Imob';
  if (!Cap.ready) Cap.init();
}
function leavePublic() { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} document.documentElement.style.removeProperty('--pub'); SESSION = readSession(); if (SESSION) enterApp(); else renderLogin(); }


</script>
</body>
</html>
