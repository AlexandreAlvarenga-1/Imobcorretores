<style>
/* Layout: navy sidebar rail + light work canvas; cards only where an object is set apart */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --surface-2: #f8fafc;
  --line: #e2e8f1;
  --line-strong: #cdd6e3;
  --text: #0d1a2d;
  --muted: #5a6a81;
  --faint: #8a98ad;
  --primary: #0b2d63;
  --primary-2: #16438e;
  --primary-soft: #e8eef9;
  --accent: #0fa597;
  --accent-soft: #dff5f2;
  --side-bg: #0a2554;
  --side-fg: #c9d6ee;
  --side-active: #ffffff;
  --side-hover: rgba(255,255,255,.07);
  --good: #12935b;
  --good-soft: #e3f5ec;
  --warn: #b7791f;
  --warn-soft: #fbf1df;
  --bad: #c53b3b;
  --bad-soft: #fbe7e7;
  --info: #2b6cd8;
  --info-soft: #e6effd;
  --shadow: 0 1px 2px rgba(13,26,45,.05), 0 6px 18px rgba(13,26,45,.06);
  --shadow-lg: 0 10px 40px rgba(13,26,45,.18);
  --ff-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --ff-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --ff-mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --r-sm: 8px;
  --r: 12px;
  --r-lg: 18px;
  --side-w: 248px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0a111d; --surface: #111a2a; --surface-2: #0e1624; --line: #1e2b40; --line-strong: #2b3b55;
    --text: #e5ecf6; --muted: #9aabc3; --faint: #6f819c; --primary: #6f9cf0; --primary-2: #8db3f7;
    --primary-soft: #16264a; --accent: #2fd0bf; --accent-soft: #0f3330; --side-bg: #070e1b; --side-fg: #a8b8d2;
    --side-active: #ffffff; --side-hover: rgba(255,255,255,.06);
    --good: #3ccf8e; --good-soft: #0f2f22; --warn: #e5b04f; --warn-soft: #33270f; --bad: #f07272; --bad-soft: #3a1717;
    --info: #74a6f5; --info-soft: #15264a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); --shadow-lg: 0 10px 40px rgba(0,0,0,.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0a111d; --surface: #111a2a; --surface-2: #0e1624; --line: #1e2b40; --line-strong: #2b3b55;
  --text: #e5ecf6; --muted: #9aabc3; --faint: #6f819c; --primary: #6f9cf0; --primary-2: #8db3f7;
  --primary-soft: #16264a; --accent: #2fd0bf; --accent-soft: #0f3330; --side-bg: #070e1b; --side-fg: #a8b8d2;
  --side-active: #ffffff; --side-hover: rgba(255,255,255,.06);
  --good: #3ccf8e; --good-soft: #0f2f22; --warn: #e5b04f; --warn-soft: #33270f; --bad: #f07272; --bad-soft: #3a1717;
  --info: #74a6f5; --info-soft: #15264a;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 18px rgba(0,0,0,.25); --shadow-lg: 0 10px 40px rgba(0,0,0,.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text); font-family: var(--ff-body); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--ff-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 { font-size: 1.6rem; font-weight: 650; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
a { color: var(--primary-2); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--ff-mono); font-size: .82em; letter-spacing: .01em; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: .85rem; }
.xs { font-size: .76rem; }
.eyebrow { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- Shell ---------- */
.app { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100%; }
.side {
  background: var(--side-bg); color: var(--side-fg); position: sticky; top: 0; height: 100vh; height: 100dvh;
  display: flex; flex-direction: column; padding: calc(18px + env(safe-area-inset-top, 0px)) 14px 16px max(14px, env(safe-area-inset-left, 0px));
  overflow-y: auto; z-index: 40;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 22px; color: #fff; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #1b5fd0, #13b3a3); display: grid; place-items: center; flex: none; }
.brand-mark svg { width: 20px; height: 20px; }
.brand-name { font-family: var(--ff-display); font-weight: 700; font-size: 1.12rem; letter-spacing: -.02em; }
.brand-name span { color: #5fe0d2; font-weight: 500; }
.brand-sub { font-size: .7rem; color: var(--side-fg); opacity: .75; letter-spacing: .04em; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: .68rem; text-transform: uppercase; letter-spacing: .1em; padding: 14px 10px 6px; opacity: .55; }
.nav button {
  display: flex; align-items: center; gap: 11px; width: 100%; padding: 9px 10px; border: 0; border-radius: 10px;
  background: transparent; color: var(--side-fg); text-align: left; font-size: .92rem; font-weight: 500; transition: background .15s, color .15s;
}
.nav button svg { width: 18px; height: 18px; flex: none; opacity: .85; }
.nav button:hover { background: var(--side-hover); color: #fff; }
.nav button.active { background: rgba(95,224,210,.12); color: var(--side-active); box-shadow: inset 2px 0 0 #5fe0d2; }
.nav button.active svg { color: #5fe0d2; opacity: 1; }
.nav .count { margin-left: auto; font-size: .72rem; background: rgba(255,255,255,.1); padding: 1px 7px; border-radius: 99px; }
.side-foot { margin-top: auto; padding: 14px 10px 0; font-size: .74rem; opacity: .7; line-height: 1.45; }
.side-foot .sync { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; }
.dot.on { background: #3ccf8e; }
.dot.warn { background: #e5b04f; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: 12px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.icon-btn.menu-btn { display: none; }
.search { position: relative; flex: 1; max-width: 520px; min-width: 0; }
.search input {
  width: 100%; border: 1px solid var(--line); background: var(--surface-2); border-radius: 10px; padding: 9px 12px 9px 38px; outline: none; transition: border .15s, background .15s;
}
.search input:focus { border-color: var(--primary-2); background: var(--surface); }
.search > svg { position: absolute; left: 12px; top: 50%; translate: 0 -50%; width: 17px; height: 17px; color: var(--faint); pointer-events: none; }
.search kbd { position: absolute; right: 10px; top: 50%; translate: 0 -50%; font-family: var(--ff-mono); font-size: .7rem; color: var(--faint); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px; }
.pop {
  position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
  box-shadow: var(--shadow-lg); max-height: 70vh; overflow-y: auto; z-index: 50; padding: 6px;
}
.pop-group { padding: 8px 10px 4px; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; }
.pop-item { display: flex; gap: 10px; align-items: center; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 8px; text-align: left; }
.pop-item:hover, .pop-item.sel { background: var(--primary-soft); }
.pop-item img { width: 40px; height: 30px; object-fit: cover; border-radius: 6px; flex: none; }
.pop-item .t { font-weight: 500; font-size: .9rem; }
.pop-empty { padding: 18px; text-align: center; color: var(--muted); font-size: .9rem; }
.top-actions { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.demo-pill svg { width: 14px; height: 14px; flex: none; }
.loc svg { width: 15px; height: 15px; flex: none; }
.demo-pill { display: inline-flex; align-items: center; gap: 6px; font-size: .72rem; font-weight: 600; color: var(--warn); background: var(--warn-soft); border-radius: 99px; padding: 4px 10px; white-space: nowrap; }
.icon-btn { position: relative; width: 38px; height: 38px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; color: var(--muted); flex: none; }
.icon-btn:hover { color: var(--text); border-color: var(--line-strong); }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn .badge { position: absolute; top: -4px; right: -4px; background: var(--bad); color: #fff; font-size: .62rem; font-weight: 700; min-width: 17px; height: 17px; border-radius: 99px; display: grid; place-items: center; padding: 0 4px; }
.profile { display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 3px; border-radius: 10px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: .85rem; font-family: var(--ff-display); flex: none; overflow: hidden; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.profile .who { text-align: left; line-height: 1.2; }
.profile .who b { display: block; font-size: .86rem; font-weight: 600; }
.profile .who span { font-size: .72rem; color: var(--muted); }
.notif-pop { position: absolute; right: 0; top: calc(100% + 8px); width: min(360px, calc(100vw - 32px)); left: auto; }
.notif { display: flex; gap: 10px; padding: 10px; border-radius: 8px; width: 100%; border: 0; background: none; text-align: left; }
.notif:hover { background: var(--surface-2); }
.notif .ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.notif .ic svg { width: 16px; height: 16px; }

.content { padding-block: 24px 60px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); width: 100%; max-width: 1380px; margin: 0 auto; }
@media (min-width: 900px) { .content { padding-left: 32px; padding-right: 32px; } }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 22px; }
.page-head p { color: var(--muted); margin-top: 4px; max-width: 64ch; }
.page-head .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.view { animation: fadeUp .28s ease both; }
@keyframes fadeUp { from { opacity: .4; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Primitives ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 7px; border: 1px solid transparent; border-radius: 10px;
  padding: 9px 15px; font-weight: 600; font-size: .88rem; white-space: nowrap; transition: background .15s, border .15s, transform .08s, box-shadow .15s;
}
.btn svg { width: 16px; height: 16px; flex: none; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; }
:root[data-theme="dark"] .btn-primary { color: #071225; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn-primary { color: #071225; } }
.btn-primary:hover:not(:disabled) { background: var(--primary-2); }
.btn-accent { background: var(--accent); color: #fff; }
.btn-accent:hover:not(:disabled) { filter: brightness(1.06); }
.btn-ghost { background: var(--surface); border-color: var(--line); color: var(--text); }
.btn-ghost:hover:not(:disabled) { border-color: var(--line-strong); background: var(--surface-2); }
.btn-danger { background: var(--bad-soft); color: var(--bad); }
.btn-danger:hover { filter: brightness(.97); }
.btn-sm { padding: 6px 11px; font-size: .8rem; border-radius: 8px; }
.btn-icon { padding: 7px; }
.link-btn { background: none; border: 0; color: var(--primary-2); font-weight: 600; font-size: .85rem; padding: 0; display: inline-flex; gap: 4px; align-items: center; }
.link-btn svg { width: 14px; height: 14px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; min-width: 0; }
.panel-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.panel-head h2 { font-size: 1rem; }
.panel-head .sub { font-size: .8rem; color: var(--muted); margin-top: 2px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 16px; }
.split-r { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.between { justify-content: space-between; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: .74rem; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip svg { width: 13px; height: 13px; }
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 99px; font-size: .72rem; font-weight: 600; white-space: nowrap; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.st-disponivel { background: var(--good-soft); color: var(--good); }
.st-reservado { background: var(--warn-soft); color: var(--warn); }
.st-vendido, .st-alugado { background: var(--info-soft); color: var(--info); }
.st-inativo { background: var(--surface-2); color: var(--faint); }
.pr-alta { background: var(--bad-soft); color: var(--bad); }
.pr-media { background: var(--warn-soft); color: var(--warn); }
.pr-baixa { background: var(--info-soft); color: var(--info); }
.tag-demo { display: inline-flex; align-items: center; font-family: var(--ff-mono); font-size: .62rem; font-weight: 600; letter-spacing: .06em; padding: 2px 6px; border-radius: 5px; background: rgba(10,20,40,.62); color: #fff; backdrop-filter: blur(4px); }
.tag-demo.light { background: var(--warn-soft); color: var(--warn); }
.up { color: var(--good); }
.down { color: var(--bad); }
.divider { height: 1px; background: var(--line); margin: 14px 0; }
.empty { text-align: center; padding: 40px 20px; color: var(--muted); }
.empty svg { width: 36px; height: 36px; color: var(--faint); margin-bottom: 10px; }
.empty h3 { color: var(--text); margin-bottom: 6px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border-radius: 10px; background: var(--info-soft); color: var(--text); font-size: .84rem; line-height: 1.45; }
.note svg { width: 17px; height: 17px; flex: none; color: var(--info); margin-top: 1px; }
.note.warn { background: var(--warn-soft); }
.note.warn svg { color: var(--warn); }
.note.good { background: var(--good-soft); }
.note.good svg { color: var(--good); }

/* Forms */
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > span, .field > label { font-size: .8rem; font-weight: 600; color: var(--muted); }
.field .req { color: var(--bad); }
.input, select.input, textarea.input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 11px; outline: none; transition: border .15s, box-shadow .15s; min-width: 0;
}
.input:focus { border-color: var(--primary-2); box-shadow: 0 0 0 3px var(--primary-soft); }
.input.err { border-color: var(--bad); }
.err-msg { color: var(--bad); font-size: .76rem; }
textarea.input { resize: vertical; min-height: 90px; line-height: 1.5; }
select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 16px) 52%, calc(100% - 11px) 52%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.form-grid.g3f { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.form-grid.g4f { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.check { display: flex; align-items: center; gap: 8px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 9px; font-size: .88rem; cursor: pointer; user-select: none; background: var(--surface); }
.check input { accent-color: var(--accent); width: 16px; height: 16px; }
.check:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; font-size: .82rem; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
input[type="range"] { accent-color: var(--accent); width: 100%; }
.range-row { display: flex; align-items: center; gap: 12px; }
.range-row output { min-width: 64px; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }

/* Tabs */
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 20px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tabs button { border: 0; background: none; padding: 10px 14px; font-weight: 600; font-size: .9rem; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; align-items: center; gap: 7px; }
.tabs button svg { width: 16px; height: 16px; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }

/* KPI tiles */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 15px 16px; display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; overflow: hidden; }
.kpi .lab { font-size: .76rem; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.kpi .lab svg { width: 15px; height: 15px; color: var(--accent); }
.kpi .val { font-family: var(--ff-display); font-size: 1.55rem; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .meta { font-size: .74rem; color: var(--faint); }
.kpi.hero { background: linear-gradient(140deg, var(--side-bg), #12458f 70%, #0f7f8a); border: 0; color: #fff; }
.kpi.hero .lab, .kpi.hero .meta { color: rgba(255,255,255,.78); }

.kpi.flash { animation: flash .9s ease; }

.chart-box { position: relative; height: 260px; }
.chart-box.sm { height: 210px; }
.chart-box.lg { height: 320px; }

/* Property cards */
.props { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
.pcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; display: flex; flex-direction: column; transition: transform .18s, box-shadow .18s, border .18s; cursor: pointer; min-width: 0; }

.pcard .ph img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s; }
.pcard:hover .ph img { transform: scale(1.04); }
.pcard .ph .tl { position: absolute; left: 10px; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.pcard .ph .tr { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
.pcard .ph .bl { position: absolute; left: 10px; bottom: 10px; }
.fav { width: 34px; height: 34px; border-radius: 50%; border: 0; background: rgba(255,255,255,.92); display: grid; place-items: center; color: #42506a; }
.fav svg { width: 17px; height: 17px; }
.fav.on { color: #e0405a; }
.fav.on svg { fill: currentColor; }
.cmp-toggle { display: inline-flex; align-items: center; gap: 5px; background: rgba(255,255,255,.92); color: #22304a; border: 0; padding: 0 10px; height: 34px; border-radius: 99px; font-size: .75rem; font-weight: 700; }
.cmp-toggle svg { width: 14px; height: 14px; }
.cmp-toggle.on { background: var(--accent); color: #fff; }
.pcard .body { padding: 14px 15px 15px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
.pcard .price { font-family: var(--ff-display); font-size: 1.15rem; font-weight: 650; letter-spacing: -.02em; }
.pcard .price small { font-size: .74rem; font-weight: 500; color: var(--muted); font-family: var(--ff-body); }
.pcard .ttl { font-weight: 600; font-size: .95rem; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .loc { font-size: .82rem; color: var(--muted); display: flex; align-items: center; gap: 4px; }
.pcard .loc svg { width: 14px; height: 14px; flex: none; }
.specs { display: flex; gap: 12px; flex-wrap: wrap; font-size: .8rem; color: var(--muted); }
.specs span { display: inline-flex; align-items: center; gap: 4px; }
.specs svg { width: 15px; height: 15px; color: var(--faint); }
.pcard .foot { margin-top: auto; padding-top: 10px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; font-size: .78rem; gap: 8px; }

/* Lists / tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); }
table.tbl { width: 100%; border-collapse: collapse; font-size: .86rem; }
.tbl th { text-align: left; font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr.click { cursor: pointer; }
.tbl tbody tr.click:hover { background: var(--surface-2); }
.tbl .r { text-align: right; font-variant-numeric: tabular-nums; }
.thumb { width: 54px; height: 40px; border-radius: 7px; object-fit: cover; display: block; }
.list-item { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.list-item:last-child { border-bottom: 0; }
.list-item .grow { flex: 1; min-width: 0; }
.list-item .t { font-weight: 600; font-size: .9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.clickable { cursor: pointer; border-radius: 10px; }
.clickable:hover { background: var(--surface-2); }
.act-ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; flex: none; background: var(--primary-soft); color: var(--primary-2); }
.act-ic svg { width: 16px; height: 16px; }

/* Quick actions */
.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.quick button { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 13px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); text-align: left; font-weight: 600; font-size: .85rem; transition: border .15s, background .15s; }

/* Recommendation */
.reco { display: flex; gap: 12px; padding: 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--line); align-items: flex-start; }

.reco p { font-size: .82rem; color: var(--muted); }

/* Opportunity */
.opp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; overflow: hidden; min-width: 0; }
.opp::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--prio, var(--info)); }
.opp.alta { --prio: var(--bad); } .opp.media { --prio: var(--warn); } .opp.baixa { --prio: var(--info); }
.opp h3 { font-size: .98rem; line-height: 1.3; }
.score { display: flex; align-items: center; gap: 8px; }
.score .bar { flex: 1; height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.score .bar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--primary-2)); border-radius: 99px; }
.score b { font-variant-numeric: tabular-nums; font-size: .85rem; min-width: 30px; text-align: right; }
.ind { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }

.ind span { display: block; font-size: .7rem; color: var(--muted); }

/* Filters */

.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }

/* Detail */
.gallery { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }

.gallery .main-ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gallery .nav-ph { position: absolute; top: 50%; translate: 0 -50%; width: 38px; height: 38px; border-radius: 50%; border: 0; background: rgba(255,255,255,.9); color: #1b2740; display: grid; place-items: center; }

.gallery .prev { left: 10px; } .gallery .next { right: 10px; }

.thumbs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; }
.thumbs button { flex: none; width: 86px; aspect-ratio: 4/3; border-radius: 9px; overflow: hidden; border: 2px solid transparent; padding: 0; background: none; opacity: .7; }
.thumbs button.on { border-color: var(--accent); opacity: 1; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.fact { background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.fact span { display: block; font-size: .72rem; color: var(--muted); }
.fact b { font-family: var(--ff-display); font-size: 1.05rem; font-variant-numeric: tabular-nums; }
.feat-list { display: flex; flex-wrap: wrap; gap: 6px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: .88rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.back { display: inline-flex; align-items: center; gap: 5px; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: .86rem; padding: 0; margin-bottom: 14px; }
.back svg { width: 16px; height: 16px; }
.back:hover { color: var(--text); }
.desc { white-space: pre-line; line-height: 1.65; color: var(--text); max-width: 70ch; }

/* Wizard */
.steps { display: flex; gap: 6px; margin-bottom: 20px; overflow-x: auto; }
.step { display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 8px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); font-size: .82rem; font-weight: 600; color: var(--muted); white-space: nowrap; }
.step i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); font-style: normal; font-size: .76rem; border: 1px solid var(--line); }
.step.on { border-color: var(--primary-2); color: var(--text); }
.step.on i { background: var(--primary); color: #fff; border-color: var(--primary); }
.step.done i { background: var(--accent); color: #fff; border-color: var(--accent); }
.wiz-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.drop { border: 2px dashed var(--line-strong); border-radius: var(--r-lg); padding: 26px; text-align: center; color: var(--muted); background: var(--surface-2); cursor: pointer; transition: border .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop svg { width: 30px; height: 30px; color: var(--accent); }
.photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin-top: 12px; }
.photo-grid .it { position: relative; aspect-ratio: 4/3; border-radius: 10px; overflow: hidden; border: 2px solid var(--line); max-width: 100%; }
.photo-grid .it.main { border-color: var(--accent); }
.photo-grid img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-grid .it .ops { position: absolute; inset: auto 6px 6px 6px; display: flex; gap: 4px; justify-content: space-between; }
.photo-grid .it .ops button { border: 0; border-radius: 6px; background: rgba(10,20,40,.72); color: #fff; font-size: .68rem; font-weight: 600; padding: 3px 6px; display: inline-flex; align-items: center; gap: 3px; }
.photo-grid .it .ops svg { width: 12px; height: 12px; }
.photo-grid .it .mainlab { position: absolute; top: 6px; left: 6px; background: var(--accent); color: #fff; font-size: .64rem; font-weight: 700; padding: 2px 6px; border-radius: 5px; }
.photo-grid .it.sel-off { opacity: .4; }

/* Modal / toast */
.scrim { position: fixed; inset: 0; background: rgba(5,12,25,.5); z-index: 80; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow-lg); width: min(560px, 100%); max-height: 100%; overflow-y: auto; animation: pop .2s ease; }
.modal.wide { width: min(860px, 100%); }
@keyframes pop { from { transform: scale(.97); opacity: 0; } }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); z-index: 2; gap: 10px; }
.modal-body { padding: 20px; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.toasts { position: fixed; bottom: max(18px, env(safe-area-inset-bottom, 0px)); right: max(18px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 8px; z-index: 90; max-width: calc(100vw - 36px); }
.toast { display: flex; align-items: center; gap: 10px; background: var(--text); color: var(--bg); padding: 11px 15px; border-radius: 11px; box-shadow: var(--shadow-lg); font-size: .88rem; font-weight: 500; animation: pop .2s ease; }
.toast svg { width: 17px; height: 17px; flex: none; }
.toast.ok svg { color: #3ccf8e; } .toast.err svg { color: #f07272; }

/* Compare tray */
.tray { position: fixed; left: 50%; translate: -50% 0; bottom: max(18px, env(safe-area-inset-bottom, 0px)); background: var(--side-bg); color: #fff; border-radius: 14px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow-lg); z-index: 70; max-width: calc(100vw - 32px); }
.tray .thumbs-mini { display: flex; gap: 6px; }
.tray img { width: 40px; height: 30px; border-radius: 6px; object-fit: cover; }

/* Market */
.big-num { font-family: var(--ff-display); font-size: 1.9rem; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; line-height: 1.1; }
.formula { font-family: var(--ff-mono); font-size: .8rem; background: var(--surface-2); border: 1px dashed var(--line-strong); padding: 8px 10px; border-radius: 8px; color: var(--muted); overflow-x: auto; }
.sc-cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.sc { border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface-2); }
.sc span { font-size: .74rem; color: var(--muted); display: block; }
.sc b { font-family: var(--ff-display); font-size: 1.08rem; font-variant-numeric: tabular-nums; }
.best { background: var(--good-soft); color: var(--good); font-weight: 700; border-radius: 6px; padding: 1px 6px; }

/* Studio */
.studio-hero { background: linear-gradient(135deg, var(--side-bg) 0%, #123f86 60%, #0b8b86 100%); color: #fff; border-radius: var(--r-lg); padding: 22px 24px; display: flex; justify-content: space-between; gap: 18px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; position: relative; overflow: hidden; }
.studio-hero p { color: rgba(255,255,255,.8); max-width: 60ch; margin-top: 4px; font-size: .9rem; }
.studio-hero .status { display: flex; gap: 8px; flex-wrap: wrap; }
.studio-hero .status > span { background: rgba(255,255,255,.12); border-radius: 99px; padding: 5px 11px; font-size: .75rem; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
.chat { display: flex; flex-direction: column; height: min(620px, 72vh); }
.chat-log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 2px 12px; }
.msg { max-width: 86%; padding: 11px 14px; border-radius: 14px; font-size: .9rem; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
.msg.u { align-self: flex-end; background: var(--primary); color: #fff; border-bottom-right-radius: 4px; }
:root[data-theme="dark"] .msg.u { color: #071225; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .msg.u { color: #071225; } }
.msg.a { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
.msg.sys { align-self: center; background: none; color: var(--muted); font-size: .8rem; text-align: center; }
.msg .tools { display: flex; gap: 6px; margin-top: 8px; }
.chat-in { display: flex; gap: 8px; align-items: flex-end; border-top: 1px solid var(--line); padding-top: 12px; }
.chat-in textarea { min-height: 46px; max-height: 140px; resize: none; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 11px; font-size: .78rem; font-weight: 600; color: var(--muted); }
.chips button:hover { border-color: var(--accent); color: var(--text); }
.thinking { display: inline-flex; gap: 4px; align-items: center; }
.thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.canvas-wrap { background: repeating-conic-gradient(var(--surface-2) 0 25%, var(--surface) 0 50%) 0 0 / 18px 18px; border: 1px solid var(--line); border-radius: var(--r-lg); padding: 16px; display: grid; place-items: center; min-height: 300px; }
.canvas-wrap canvas, .canvas-wrap video { max-width: 100%; max-height: 560px; height: auto; border-radius: 8px; box-shadow: var(--shadow-lg); display: block; }
.tpl-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tpl-grid button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 8px; font-size: .78rem; font-weight: 600; text-align: center; color: var(--muted); }
.tpl-grid button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--surface); box-shadow: 0 0 0 1px var(--line); }
.swatches button.on { box-shadow: 0 0 0 2px var(--accent); }
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--primary-2)); width: 0; transition: width .2s; }
.vlib { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.vlib .v { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface-2); font-size: .78rem; }
.vlib .v img { width: 100%; aspect-ratio: 16/10; object-fit: cover; display: block; }
.vlib .v div { padding: 8px 10px; }
.gen-box { border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px; background: var(--surface-2); }
.status-line { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--surface); border: 1px solid var(--line); font-size: .86rem; }

/* CRM */
.funnel { display: grid; grid-template-columns: repeat(5, minmax(220px, 1fr)); gap: 12px; overflow-x: auto; padding-bottom: 6px; }
.col { background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 220px; }
.col-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: .85rem; }
.col-head span { font-size: .74rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; }
.ccard { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 11px 12px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; transition: border .15s; }
.ccard:hover { border-color: var(--accent); }
.ccard .n { font-weight: 600; font-size: .9rem; }
.ccard .m { font-size: .76rem; color: var(--muted); }
.ccard .mv { display: flex; justify-content: space-between; gap: 4px; }
.ccard .mv button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 7px; padding: 2px 6px; display: grid; place-items: center; color: var(--muted); }
.ccard .mv button svg { width: 14px; height: 14px; }
.match { display: flex; gap: 10px; align-items: center; padding: 8px; border: 1px solid var(--line); border-radius: 12px; }
.match img { width: 64px; height: 48px; object-fit: cover; border-radius: 8px; flex: none; }
.match .crit { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.crit span { font-size: .68rem; padding: 1px 6px; border-radius: 5px; font-weight: 600; }
.crit .ok { background: var(--good-soft); color: var(--good); }
.crit .no { background: var(--surface-2); color: var(--faint); text-decoration: line-through; }

/* Settings */
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.set-row:last-child { border-bottom: 0; }
.set-row .grow { flex: 1; min-width: 200px; }


/* Login */
.login { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); min-height: 100vh; min-height: 100dvh; background: var(--surface); }

function compressImage(file, maxSide = 900, budget = 42000) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('Não foi possível ler o arquivo.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Formato de imagem não suportado.'));
      img.onload = () => {
        let side = maxSide, q = .72, out = '';
        for (let k = 0; k < 7; k++) {
          const s = Math.min(1, side / Math.max(img.width, img.height));
          const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          out = c.toDataURL('image/jpeg', q);
          if (out.length * .75 <= budget) break;
          if (q > .5) q -= .08; else side = Math.round(side * .82);
        }
        resolve(out);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

  const muted = cssVar('--muted'), line = cssVar('--line');
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  Chart.defaults.font.size = 12; Chart.defaults.color = muted; Chart.defaults.borderColor = line;
  Chart.defaults.plugins.legend.labels.usePointStyle = true; Chart.defaults.plugins.legend.labels.boxWidth = 8;
  Chart.defaults.plugins.tooltip.backgroundColor = cssVar('--text'); Chart.defaults.plugins.tooltip.titleColor = cssVar('--bg'); Chart.defaults.plugins.tooltip.bodyColor = cssVar('--bg');
  Chart.defaults.plugins.tooltip.padding = 10; Chart.defaults.plugins.tooltip.cornerRadius = 8;
  Chart.defaults.maintainAspectRatio = false; Chart.defaults.animation.duration = 500;
}
const SERIES = () => [cssVar('--primary'), cssVar('--accent'), '#7c8fd6', '#e0a24a', '#c86b8a', '#6aa9c9'];

const NAV = [
  ['overview', 'Visão Geral', 'grid'], ['explore', 'Explorar Imóveis', 'compass'], ['mine', 'Meus Imóveis', 'building'], ['match', 'Match de Imóveis', 'match'],
  ['opps', 'Oportunidades', 'target'], ['market', 'Inteligência de Mercado', 'chart'], ['studio', 'Estúdio de IA', 'sparkles'],

];
const NAV_PARENT = { prop: null, form: 'mine', opp: 'opps', ficha: 'mine' };

const App = {
  page: 'overview', params: {}, history: [],
  go(page, params = {}, push = true) {
    if (push && (this.page !== page || JSON.stringify(this.params) !== JSON.stringify(params))) this.history.push([this.page, this.params]);
    this.page = page; this.params = params;
    $('.app').classList.remove('nav-open');
    this.render(); window.scrollTo({ top: 0 });
  },
  back(fallback = 'overview') { const h = this.history.pop(); if (h) { this.page = h[0]; this.params = h[1]; this.render(); window.scrollTo({ top: 0 }); } else this.go(fallback, {}, false); },
  refresh() { const y = window.scrollY; this.render(); window.scrollTo({ top: y }); },
  render() {
    destroyCharts();
    if (this.page === 'match' && !FLAGS.match) { this.page = 'overview'; this.params = {}; }
    if (this.page === 'prop' && this.params.from === 'match' && !FLAGS.match) this.params = Object.assign({}, this.params, { from: 'explore' });
    const v = Views[this.page] || Views.overview;
    const root = $('#view');
    root.innerHTML = `<div class="view">${v.render(this.params)}</div>`;
    if (v.mount) v.mount(root, this.params);
    const active = this.page === 'prop' ? (this.params.from || 'explore') : (NAV_PARENT[this.page] || this.page);
    $$('.nav button[data-go]').forEach(b => b.classList.toggle('active', b.dataset.go === active));
    $('#cnt-mine').textContent = myProps().length;
    $('#cnt-crm').textContent = S.clients.length;
    renderTray(); renderNotifBadge(); renderProfile();
    document.title = 'Nexo Imob';
  }
};

function navBtn([id, label, icon]) {
  if (id === 'match' && !FLAGS.match) return '';
  const cnt = id === 'mine' ? '<span class="count" id="cnt-mine"></span>' : id === 'crm' ? '<span class="count" id="cnt-crm"></span>' : '';
  return `<button data-go="${id}">${ic(icon)}<span>${label}</span>${cnt}</button>`;
}
function renderProfile() {
  const s = S.settings; const ini = (s.name || 'C').split(' ').map(x => x[0]).slice(0, 2).join('').toUpperCase();
  $('#profile').innerHTML = `<span class="avatar">${s.logo ? `<img src="${s.logo}" alt="">` : esc(ini)}</span><span class="who"><b>${esc(s.name)}</b><span>${esc(s.creci)}</span></span>`;
}

/* Busca global */
function setupSearch() {
  const box = $('#gsearch'), inp = $('#gq'); let sel = -1;
  const close = () => { const p = $('.pop', box); if (p) p.remove(); sel = -1; };
  const run = () => {
    const q = inp.value.trim().toLowerCase(); close(); if (!q) return;
    const has = s => String(s || '').toLowerCase().includes(q);
    const props = S.props.filter(p => [p.title, p.code, p.hood, p.city, p.type, p.street].some(has)).slice(0, 6);
    const clients = S.clients.filter(c => [c.name, c.email, c.region, c.city, c.phone].some(has)).slice(0, 5);
    const opps = S.opps.filter(o => [o.title, OPP_CATS[o.category], o.hood, o.city].some(has)).slice(0, 5);
    const pop = document.createElement('div'); pop.className = 'pop';
    if (!props.length && !clients.length && !opps.length) pop.innerHTML = `<div class="pop-empty">Nada encontrado para “${esc(inp.value)}”. Tente bairro, código ou nome.</div>`;
    else pop.innerHTML =
      (props.length ? `<div class="pop-group">Imóveis</div>` + props.map(p => `<button class="pop-item" data-k="prop" data-id="${p.id}"><img src="${photoUrl(p)}" alt=""><span><span class="t">${esc(p.title)}</span><br><span class="xs muted">${p.code} · ${esc(p.hood)}, ${esc(p.city)} · ${fmtShort(p.price)}${isRent(p) ? '/mês' : ''}</span></span></button>`).join('') : '') +
      (clients.length ? `<div class="pop-group">Clientes</div>` + clients.map(c => `<button class="pop-item" data-k="client" data-id="${c.id}"><span class="avatar" style="width:30px;height:30px;font-size:.7rem">${esc(c.name[0])}</span><span><span class="t">${esc(c.name)}</span><br><span class="xs muted">${esc(c.region)} · ${c.interest}</span></span></button>`).join('') : '') +
      (opps.length ? `<div class="pop-group">Oportunidades</div>` + opps.map(o => `<button class="pop-item" data-k="opp" data-id="${o.id}"><span class="act-ic">${ic('target')}</span><span><span class="t">${esc(o.title)}</span><br><span class="xs muted">${OPP_CATS[o.category]}</span></span></button>`).join('') : '');
    box.appendChild(pop);
    $$('.pop-item', pop).forEach(b => b.onmousedown = e => { e.preventDefault(); openResult(b.dataset.k, b.dataset.id); });
  };
  const openResult = (k, id) => { close(); inp.value = ''; inp.blur(); if (k === 'prop') App.go('prop', { id }); else if (k === 'client') { App.go('crm'); setTimeout(() => clientModal(id), 30); } else App.go('opp', { id }); };
  inp.addEventListener('input', run);
  inp.addEventListener('focus', run);
  inp.addEventListener('blur', () => setTimeout(close, 120));
  inp.addEventListener('keydown', e => {
    const items = $$('.pop-item', box); if (!items.length) return;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; items.forEach((it, i) => it.classList.toggle('sel', i === sel)); }
    if (e.key === 'Enter') { const it = items[Math.max(sel, 0)]; openResult(it.dataset.k, it.dataset.id); }
  });
  document.addEventListener('keydown', e => { if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); inp.focus(); } });
}

/* Notificações (derivadas dos dados) */
function notifications() {
  const out = [];
  S.opps.forEach(o => { const ev = oppEval(o); if (ev.available && ev.priority === 'alta') out.push({ icon: 'target', tone: 'bad', t: 'Oportunidade de prioridade alta', d: o.title, go: () => App.go('opp', { id: o.id }) }); });
  myProps().filter(activeStatus).forEach(p => { const cs = clientsFor(p); if (cs.length) out.push({ icon: 'users', tone: 'info', t: `${cs.length} cliente(s) compatível(is)`, d: `${p.code} · ${p.title}`, go: () => App.go('prop', { id: p.id, from: 'mine' }) }); });
  myProps().filter(p => activeStatus(p) && !S.materials.some(m => m.propId === p.id)).forEach(p => out.push({ icon: 'sparkles', tone: 'good', t: 'Imóvel sem material de divulgação', d: `${p.code} · crie um anúncio no Estúdio`, go: () => { UI.studio.propId = p.id; UI.studio.tab = 'ads'; App.go('studio'); } }));
  return out;
}
function renderNotifBadge() { const n = notifications().length; const b = $('#nbadge'); if (!b) return; const unseen = Math.max(0, n - (S.notifSeen || 0)); b.hidden = !unseen; b.textContent = unseen; }
function setupNotifs() {
  const bell = $('#bell');
  bell.onclick = e => {
    e.stopPropagation(); const wrap = bell.parentElement; const ex = $('.pop', wrap); if (ex) { ex.remove(); return; }
    const list = notifications(); S.notifSeen = list.length; Store.save(); renderNotifBadge();
    const pop = document.createElement('div'); pop.className = 'pop notif-pop';
    const tone = { bad: ['var(--bad-soft)', 'var(--bad)'], info: ['var(--info-soft)', 'var(--info)'], good: ['var(--good-soft)', 'var(--good)'] };
    pop.innerHTML = `<div class="pop-group">Notificações</div>` + (list.length ? list.map((n, i) => `<button class="notif" data-i="${i}"><span class="ic" style="background:${tone[n.tone][0]};color:${tone[n.tone][1]}">${ic(n.icon)}</span><span><b class="small">${esc(n.t)}</b><br><span class="xs muted">${esc(n.d)}</span></span></button>`).join('') : '<div class="pop-empty">Tudo em dia.</div>');
    wrap.appendChild(pop);
    $$('.notif', pop).forEach(b => b.onclick = () => { pop.remove(); list[+b.dataset.i].go(); });
    setTimeout(() => document.addEventListener('click', function h(ev) { if (!pop.contains(ev.target)) { pop.remove(); document.removeEventListener('click', h); } }), 0);
  };
}

/* Bandeja de comparação */
function renderTray() {
  let t = $('#tray'); const ids = UI.compare.filter(id => getProp(id));
  UI.compare = ids;
  if (!ids.length || App.page === 'market') { if (t) t.remove(); return; }
  if (!t) { t = document.createElement('div'); t.id = 'tray'; t.className = 'tray'; document.body.appendChild(t); }
  t.innerHTML = `<div class="thumbs-mini">${ids.map(id => `<img src="${photoUrl(getProp(id))}" alt="">`).join('')}</div><span class="small"><b>${ids.length}</b> de 3 para comparar</span><button class="btn btn-accent btn-sm" id="tray-go" ${ids.length < 2 ? 'disabled' : ''}>${ic('scale')}Comparar</button><button class="icon-btn" style="background:transparent;border-color:rgba(255,255,255,.25);color:#fff" id="tray-x" aria-label="Limpar comparação">${ic('x')}</button>`;
  $('#tray-go').onclick = () => { UI.market.cmp = ids.slice(); UI.market.tab = 'comparar'; App.go('market'); };
  $('#tray-x').onclick = () => { UI.compare = []; App.refresh(); };
}
function toggleCompare(id) {
  const i = UI.compare.indexOf(id);
  if (i >= 0) UI.compare.splice(i, 1);
  else { if (UI.compare.length >= 3) { toast('Compare até 3 imóveis por vez.', 'err'); return; } UI.compare.push(id); }
}
function toggleFav(id) { const i = S.favorites.indexOf(id); if (i >= 0) S.favorites.splice(i, 1); else S.favorites.push(id); Store.save(); }

function applyTheme() { const t = S.settings.theme; if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }

/* ===== Componentes de imóvel ===== */
function priceTag(p) { return isRent(p) ? `${fmtBRL(p.price)}<small> /mês</small>` : fmtBRL(p.price); }
function specs(p) {
  const s = [];
  s.push(`<span>${ic('ruler')}${fmtNum(p.area)} m²</span>`);
  if (p.beds) s.push(`<span>${ic('bed')}${p.beds} qto${p.beds > 1 ? 's' : ''}</span>`);
  s.push(`<span>${ic('bath')}${p.baths} banh.</span>`);
  if (p.parking) s.push(`<span>${ic('car')}${p.parking} vaga${p.parking > 1 ? 's' : ''}</span>`);
  return `<div class="specs">${s.join('')}</div>`;
}
function statusPill(s) { return `<span class="pill st-${s}">${statusLabel(s)}</span>`; }
function propCard(p, opts = {}) {
  const fav = S.favorites.includes(p.id), cmp = UI.compare.includes(p.id);
  const d = vsRef(p);
  return `<article class="pcard" data-open="${p.id}" tabindex="0" aria-label="${esc(p.title)}">
    <div class="ph"><img src="${photoUrl(p)}" alt="${esc(p.title)}" loading="lazy">
      <div class="tl">${p.portfolio ? '<span class="tag-demo" style="background:rgba(15,165,151,.9)">MINHA CARTEIRA</span>' : ''}</div>
      <div class="tr">${opts.noCompare ? '' : `<button class="cmp-toggle ${cmp ? 'on' : ''}" data-cmp="${p.id}" aria-pressed="${cmp}">${ic('scale')}${cmp ? 'Na comparação' : 'Comparar'}</button>`}<button class="fav ${fav ? 'on' : ''}" data-fav="${p.id}" aria-label="${fav ? 'Remover dos favoritos' : 'Salvar nos favoritos'}">${ic('heart')}</button></div>
      <div class="bl">${statusPill(p.status)}</div>
    </div>
    <div class="body">
      <div class="price num">${priceTag(p)}</div>
      <div class="ttl">${esc(p.title)}</div>
      <div class="loc">${ic('pin')}${esc(p.hood)}, ${esc(p.city)} · ${esc(p.state)}</div>
      ${specs(p)}
      <div class="foot"><span class="mono muted">${p.code}</span><span class="num">${isRent(p) ? fmtBRL(p.price / p.area, 2) + '/m²' : fmtBRL(pricePerM2(p)) + '/m²'}${d != null ? ` <span class="${d <= 0 ? 'up' : 'muted'}" title="vs. referência do bairro">${fmtPct(d, 0)}</span>` : ''}</span></div>
    </div>
  </article>`;
}
function bindCards(root, from) {
  $$('[data-fav]', root).forEach(b => b.onclick = e => { e.stopPropagation(); toggleFav(b.dataset.fav); const on = S.favorites.includes(b.dataset.fav); b.classList.toggle('on', on); toast(on ? 'Salvo nos favoritos' : 'Removido dos favoritos'); });
  $$('[data-cmp]', root).forEach(b => b.onclick = e => { e.stopPropagation(); toggleCompare(b.dataset.cmp); const on = UI.compare.includes(b.dataset.cmp); b.classList.toggle('on', on); b.innerHTML = ic('scale') + (on ? 'Na comparação' : 'Comparar'); renderTray(); });
  $$('[data-open]', root).forEach(c => { const go = () => App.go('prop', { id: c.dataset.open, from }); c.onclick = go; c.onkeydown = e => { if (e.key === 'Enter') go(); }; });
}

    const mine = myProps(); const sale = mine.filter(p => !isRent(p) && activeStatus(p));

    const ctx = $('#ch-evo');
    const grad = ctx.getContext('2d').createLinearGradient(0, 0, 0, 260); grad.addColorStop(0, cssVar('--accent') + '55'); grad.addColorStop(1, cssVar('--accent') + '00');

      options: { plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ' ' + fmtBRL(c.parsed.y) } } }, scales: { x: { grid: { display: false }, ticks: { maxTicksLimit: 8 } }, y: { ticks: { callback: v => fmtShort(v) }, grid: { color: cssVar('--line') } } } } });
    // Categorias
    const cats = TYPES.map(t => mine.filter(p => p.type === t).length);
    chart($('#ch-cat'), { type: 'doughnut', data: { labels: TYPES, datasets: [{ data: cats, backgroundColor: C, borderColor: cssVar('--surface'), borderWidth: 3 }] }, options: { cutout: '66%', plugins: { legend: { position: 'bottom' } } } });
    // Variação
    const vp = mine.slice().map(p => ({ p, v: var12(p) })).sort((a, b) => b.v - a.v);
    chart($('#ch-var'), { type: 'bar', data: { labels: vp.map(x => x.p.code), datasets: [{ data: vp.map(x => +x.v.toFixed(2)), backgroundColor: vp.map(x => x.v >= 0 ? cssVar('--good') : cssVar('--bad')), borderRadius: 6, maxBarThickness: 22 }] },
      options: { indexAxis: 'y', plugins: { legend: { display: false }, tooltip: { callbacks: { label: c => ' ' + fmtPct(c.parsed.x) + ' (estimado)' } } }, scales: { x: { ticks: { callback: v => v + '%' }, grid: { color: cssVar('--line') } }, y: { grid: { display: false } } } } });
    // Comparação
    chart($('#ch-cmp'), { type: 'bar', data: { labels: sale.map(p => p.code), datasets: [
      { label: 'Preço', data: sale.map(p => p.price), backgroundColor: C[0], borderRadius: 6, yAxisID: 'y', maxBarThickness: 34 },
      { label: 'Preço/m²', data: sale.map(p => Math.round(pricePerM2(p))), type: 'line', borderColor: C[1], backgroundColor: C[1], yAxisID: 'y1', tension: .3, pointRadius: 4 }] },
      options: { plugins: { tooltip: { callbacks: { label: c => ' ' + c.dataset.label + ': ' + fmtBRL(c.parsed.y) } } }, scales: { x: { grid: { display: false } }, y: { ticks: { callback: v => fmtShort(v) }, grid: { color: cssVar('--line') } }, y1: { position: 'right', grid: { display: false }, ticks: { callback: v => 'R$ ' + fmtNum(v / 1000) + 'k' } } } } });
  }
};
function recommendations() {
  const out = []; let i = 0;
  const add = (icon, t, d, go) => out.push({ i: i++, icon, t, d, go });
  const noMat = myProps().filter(p => activeStatus(p) && !S.materials.some(m => m.propId === p.id));
  if (noMat.length) add('sparkles', `Divulgue ${noMat[0].code}`, `${noMat.length} imóvel(is) ativo(s) sem anúncio ou arte. Gere um texto em segundos.`, () => { UI.studio.propId = noMat[0].id; UI.studio.tab = 'ads'; App.go('studio'); });
  const best = myProps().filter(activeStatus).map(p => ({ p, n: clientsFor(p).length })).sort((a, b) => b.n - a.n)[0];
  if (best && best.n) add('users', `${best.n} cliente(s) para ${best.p.code}`, 'Há clientes com orçamento, região e quartos compatíveis. Revise e entre em contato.', () => App.go('prop', { id: best.p.id, from: 'mine' }));
  const stale = S.clients.filter(c => c.stage === 'novo');
  if (stale.length) add('message', `Responda ${stale.length} novo(s) contato(s)`, 'Contatos na etapa inicial do funil aguardam primeiro atendimento.', () => App.go('crm'));
  const below = S.opps.map(o => ({ o, ev: oppEval(o) })).filter(x => x.ev.available && x.o.category === 'abaixo').sort((a, b) => b.ev.score - a.ev.score)[0];
  if (below) add('target', 'Analise uma oportunidade abaixo da referência', below.o.title, () => App.go('opp', { id: below.o.id }));
  const noPhoto = myProps().filter(p => !p.demo && !p.photos.length);
  if (noPhoto.length) add('image', 'Adicione fotos aos seus imóveis', `${noPhoto.length} imóvel(is) cadastrado(s) sem fotografias.`, () => App.go('mine'));
  return out.slice(0, 4);
}

function startWizard(editId) {

    UI.wizard = { step: 0, editId, d: JSON.parse(JSON.stringify(p)), errors: {} };
  } else if (!UI.wizard || UI.wizard.editId) {
    UI.wizard = { step: 0, editId: null, errors: {}, d: { title: '', type: 'Apartamento', purpose: 'venda', price: '', condo: '', iptu: '', area: '', builtArea: '', beds: '', suites: '', baths: '', parking: '', cep: '', state: 'MG', city: 'Belo Horizonte', hood: '', street: '', number: '', complement: '', privateAddress: true, furnished: false, features: [], photos: [], mainPhoto: 0, description: '', notes: '', contactAuthorized: false, contact: '', status: 'disponivel' } };
  }

}
function wizValidate(step, d) {
  const e = {};
  const need = (k, msg) => { if (d[k] === '' || d[k] == null || (typeof d[k] === 'number' && isNaN(d[k]))) e[k] = msg; };
  if (step === 0) {
    if (!String(d.title).trim() || String(d.title).trim().length < 8) e.title = 'Escreva um título com pelo menos 8 caracteres.';
    if (!(parseMoney(d.price) > 0)) e.price = 'Informe o preço' + (d.purpose === 'locacao' ? ' do aluguel mensal.' : ' de venda.');
    if (!(+d.area > 0)) e.area = 'Informe a área em m².';
    need('baths', 'Informe os banheiros.'); if (d.type !== 'Comercial') need('beds', 'Informe os quartos.');
    if (+d.suites > +d.beds) e.suites = 'Suítes não podem exceder o número de quartos.';
  }
  if (step === 1) {
    if (d.cep && !/^\d{5}-?\d{3}$/.test(d.cep)) e.cep = 'CEP no formato 00000-000.';
    need('state', 'Selecione o estado.'); if (!String(d.city).trim()) e.city = 'Informe a cidade.'; if (!String(d.hood).trim()) e.hood = 'Informe o bairro.';
  }
  if (step === 3) { if (String(d.description).trim().length < 30) e.description = 'Escreva uma descrição com pelo menos 30 caracteres.'; }
  return e;
}

      drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); }; drop.ondragleave = () => drop.classList.remove('over');

    const go = n => { if (n > w.step) { for (let k = w.step; k < n; k++) { const e = wizValidate(k, d); if (Object.keys(e).length) { w.errors = e; w.step = k; App.refresh(); toast('Revise os campos destacados.', 'err'); const first = $('.input.err'); if (first) first.focus(); return; } } } w.errors = {}; w.step = n; App.refresh(); };

      let p;
      if (w.editId) { p = getProp(w.editId); Object.assign(p, base); logActivity('edit', `${p.code} atualizado`); toast('Alterações salvas', 'ok'); }
      else {

};
